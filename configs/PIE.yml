PROJECT: 'PIE'
CKPT_DIR: 'checkpoints/PIE'
OUT_DIR: 'outputs/PIE'
DEVICE: 'cuda'
METHOD: 'PIE'
VISUALIZE: False
MODEL:
  IMG_SIZE: [256, 256]
  BEST_OF_MANY: True
  K: 20
  LATENT_DIST: 'gaussian'
  LATENT_DIM: 32

  PRED_LEN: 45 # input and pred_len is defined in 30FPS
  GLOBAL_EMBED_SIZE: 256
  GLOBAL_HIDDEN_SIZE:  256
  GLOBAL_INPUT_DIM: 4
  DROPOUT: 0.0

  ENC_CONCAT_TYPE: 'average'
  INPUT_EMBED_SIZE: 256
  FLOW_EMBED_SIZE: 256
  FLOW_HIDDEN_SIZE: 256
  ENC_HIDDEN_SIZE: 256
  DEC_INPUT_SIZE: 256
  DEC_HIDDEN_SIZE: 256
  DEC_OUTPUT_DIM: 4

DATASET:
  NAME: 'PIE'
  ROOT: 'data/PIE'
  TRAJECTORY_PATH: 'data/PIE'
  BBOX_TYPE: 'cxcywh' # bbox is in cxcywh format
  NORMALIZE: 'zero-one'
  MIN_BBOX: [0,0,0,0] # the min of cxcywh or x1x2y1y2
  MAX_BBOX: [1920, 1080, 1920, 1080] # the max of cxcywh or x1x2y1y2
DATALOADER:
  NUM_WORKERS: 0
SOLVER:
  MAX_EPOCH: 100
#  BATCH_SIZE: 256
  BATCH_SIZE: 128
  LR: 0.001
  scheduler: 'plateau'
  PLATEAU_FACTOR: 0.2
  PLATEAU_PATIENCE: 5
  MIN_LR: 0.0000001
TEST:
  BATCH_SIZE: 128
